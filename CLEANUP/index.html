<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repository Cleanup Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161A;
    --panel:#1A2025;
    --panel-hover:#1F262C;
    --panel-raised:#20272D;
    --rule:#2A3138;
    --rule-strong:#3A434C;
    --ink:#EAEDEA;
    --slate:#B7C0C6;
    --slate-light:#7D8890;
    --emerald:#3FA980;
    --emerald-dark:#2C8067;
    --emerald-tint:rgba(63,169,128,0.12);
    --gold:#D4A24C;
    --gold-tint:rgba(212,162,76,0.12);
    --danger:#E0685A;
    --danger-tint:rgba(224,104,90,0.12);
    --violet:#8B7FD6;
    --violet-tint:rgba(139,127,214,0.12);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:1200px;margin:0 auto;padding:0 32px;}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- Site nav ---------- */
  .site-nav{border-bottom:1px solid var(--rule-strong);background:var(--bg);}
  .nav-inner{display:flex;gap:26px;padding:14px 32px;max-width:1200px;margin:0 auto;}
  .nav-link{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--slate-light);
    text-decoration:none;
    padding-bottom:3px;
    border-bottom:2px solid transparent;
  }
  .nav-link:hover{color:var(--ink);}
  .nav-link.active{color:var(--emerald);border-bottom-color:var(--emerald);}

  /* ---------- Masthead ---------- */
  .masthead{
    border-bottom:1px solid var(--rule-strong);
    padding:56px 0 40px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--emerald);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .eyebrow::before{
    content:"";
    width:7px;height:7px;
    background:var(--emerald);
    border-radius:1px;
    display:inline-block;
  }
  .eyebrow .date{color:var(--slate-light);margin-left:auto;}

  .id-row{display:flex;gap:28px;align-items:flex-start;}
  .avatar{
    width:88px;height:88px;
    border-radius:6px;
    object-fit:cover;
    border:1px solid var(--rule-strong);
    background:var(--panel);
    flex-shrink:0;
  }
  .id-main h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:clamp(30px,4.6vw,42px);
    line-height:1.05;
    margin:0 0 6px;
    letter-spacing:-.01em;
    color:var(--ink);
  }
  .id-main .handle{
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    color:var(--slate-light);
    margin-bottom:14px;
  }
  .id-main .handle a{text-decoration:none;border-bottom:1px solid var(--rule-strong);}
  .id-main .handle a:hover{border-color:var(--emerald);color:var(--emerald);}
  .bio{max-width:60ch;color:var(--slate);font-size:15.5px;margin:0;}

  /* ---------- Cleanup Dashboard ---------- */
  .dash-heading{
    display:flex;align-items:center;gap:10px;
    margin:36px 0 12px;
  }
  .dash-heading h2{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--slate-light);
    margin:0;
  }
  .dash-heading .rule{flex:1;height:1px;background:var(--rule);}

  .progress-track{
    height:6px;
    background:var(--panel);
    border:1px solid var(--rule-strong);
    border-radius:100px;
    overflow:hidden;
    margin-bottom:14px;
  }
  .progress-fill{
    height:100%;
    background:var(--emerald);
    border-radius:100px;
    transition:width .3s ease;
    width:0%;
  }

  .dash-grid{
    display:grid;
    grid-template-columns:repeat(9,1fr);
    border:1px solid var(--rule-strong);
    border-radius:6px;
    overflow:hidden;
    background:var(--panel);
    margin-bottom:8px;
  }
  .dash-cell{
    padding:14px 12px;
    border-right:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
  }
  .dash-cell:nth-child(9n){border-right:none;}
  .dash-cell .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:19px;
    font-weight:600;
    color:var(--ink);
    display:block;
  }
  .dash-cell .lbl{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--slate-light);
    margin-top:2px;
    display:block;
    white-space:nowrap;
  }
  .dash-cell.accent-keep .num{color:var(--emerald);}
  .dash-cell.accent-merge .num{color:var(--gold);}
  .dash-cell.accent-archive .num{color:var(--slate-light);}
  .dash-cell.accent-dup .num{color:var(--danger);}

  /* ---------- Toolbar ---------- */
  .toolbar{
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:10;
    padding:18px 0;
    border-bottom:1px solid var(--rule);
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .search-box{position:relative;flex:1 1 200px;}
  .search-box input{
    width:100%;
    padding:10px 14px 10px 34px;
    border:1px solid var(--rule-strong);
    border-radius:5px;
    background:var(--panel);
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  .search-box input::placeholder{color:var(--slate-light);}
  .search-box input:focus{outline:2px solid var(--emerald);outline-offset:1px;}
  .search-box::before{
    content:"";
    position:absolute;
    left:12px;top:50%;
    transform:translateY(-50%);
    width:12px;height:12px;
    border:1.5px solid var(--slate-light);
    border-radius:50%;
  }
  .search-box::after{
    content:"";
    position:absolute;
    left:20px;top:16px;
    width:6px;height:1.5px;
    background:var(--slate-light);
    transform:rotate(45deg);
  }
  select, .btn, .toggle-btn{
    padding:10px 13px;
    border:1px solid var(--rule-strong);
    border-radius:5px;
    background:var(--panel);
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    color:var(--ink);
    cursor:pointer;
  }
  select:focus, .btn:focus, .toggle-btn:focus{outline:2px solid var(--emerald);outline-offset:1px;}
  .btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    white-space:nowrap;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .btn:hover{border-color:var(--slate-light);}
  .btn.primary{background:var(--emerald);border-color:var(--emerald);color:#0B0F12;font-weight:600;}
  .btn.primary:hover{background:var(--emerald-dark);border-color:var(--emerald-dark);}
  .btn.danger-outline{color:var(--danger);border-color:var(--danger);}
  .btn.danger-outline:hover{background:var(--danger-tint);}
  .toggle-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
  }
  .toggle-btn.active{background:var(--emerald);border-color:var(--emerald);color:#0B0F12;font-weight:600;}

  .toolbar-row2{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    padding:12px 0 4px;
  }

  .lang-chips{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 18px;}
  .chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    padding:6px 11px;
    border:1px solid var(--rule-strong);
    border-radius:100px;
    background:var(--panel);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--slate);
  }
  .chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .chip.active{background:var(--emerald);border-color:var(--emerald);color:#0B0F12;}
  .chip:hover:not(.active){border-color:var(--slate-light);}

  /* ---------- Groups ---------- */
  .group{margin-bottom:8px;}
  .group-header{
    display:flex;
    align-items:center;
    gap:10px;
    margin:40px 0 16px;
  }
  .group-header .tag{
    width:9px;height:9px;
    border-radius:2px;
    flex-shrink:0;
    background:var(--slate-light);
  }
  .group-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--slate-light);
  }
  .group-title strong{color:var(--ink);}
  .group-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--slate-light);
    margin-left:auto;
  }
  .group-rule{flex:1;height:1px;background:var(--rule);margin-left:6px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:16px;
    padding-bottom:16px;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--rule-strong);
    border-left:3px solid var(--rule-strong);
    border-radius:6px;
    padding:18px 20px;
    display:flex;
    flex-direction:column;
    gap:11px;
    transition:border-color .15s ease;
  }
  .card.state-KEEP{border-left-color:var(--emerald);}
  .card.state-MERGE{border-left-color:var(--gold);}
  .card.state-ARCHIVE{border-left-color:var(--slate-light);}
  .card.state-DUPLICATE{border-left-color:var(--danger);}

  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card-name-wrap{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .card-name{font-family:'Fraunces',serif;font-weight:600;font-size:17px;line-height:1.25;color:var(--ink);}
  .card-name a{text-decoration:none;}
  .card-name a:hover{color:var(--emerald);}
  .card-meta-line{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--slate-light);
    display:flex;gap:10px;flex-wrap:wrap;
  }
  .fork-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--gold);
    background:var(--gold-tint);
    border:1px solid var(--gold);
    padding:2px 6px;
    border-radius:3px;
    white-space:nowrap;
    text-transform:uppercase;
    letter-spacing:.05em;
    flex-shrink:0;
  }
  .reviewed-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    padding:3px 7px;
    border-radius:3px;
    text-transform:uppercase;
    letter-spacing:.05em;
    white-space:nowrap;
    flex-shrink:0;
  }
  .reviewed-badge.yes{color:var(--emerald);background:var(--emerald-tint);border:1px solid var(--emerald);}
  .reviewed-badge.no{color:var(--slate-light);background:transparent;border:1px solid var(--rule-strong);}

  .card-desc{color:var(--slate);font-size:13.3px;}

  .suggestion{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--violet);
    background:var(--violet-tint);
    border:1px dashed var(--violet);
    border-radius:5px;
    padding:8px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    flex-wrap:wrap;
  }
  .suggestion .apply-sugg{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    background:transparent;
    border:1px solid var(--violet);
    color:var(--violet);
    border-radius:4px;
    padding:4px 8px;
    cursor:pointer;
    white-space:nowrap;
  }
  .suggestion .apply-sugg:hover{background:var(--violet-tint);}

  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .field label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--slate-light);
    margin-bottom:4px;
  }
  .field select, .field input[type="text"]{
    width:100%;
    padding:7px 9px;
    border:1px solid var(--rule-strong);
    border-radius:4px;
    background:var(--bg);
    color:var(--ink);
    font-size:13px;
    font-family:'Inter',sans-serif;
  }
  .field select:focus, .field input[type="text"]:focus{outline:2px solid var(--emerald);outline-offset:1px;}

  .card-actions-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .card-actions-row .btn{padding:7px 10px;font-size:11px;}

  .card-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--slate-light);
    border-top:1px solid var(--rule);
    padding-top:10px;
  }
  .card-stats{display:flex;gap:12px;align-items:center;}
  .lang-tag{display:flex;align-items:center;gap:5px;color:var(--slate);}
  .lang-dot{width:8px;height:8px;border-radius:50%;}

  .empty, .loading, .error{
    padding:60px 20px;
    text-align:center;
    color:var(--slate-light);
    font-family:'IBM Plex Mono',monospace;
    font-size:13.5px;
  }
  .error{color:var(--danger);}
  .spinner{
    width:22px;height:22px;
    border:2px solid var(--rule-strong);
    border-top-color:var(--emerald);
    border-radius:50%;
    margin:0 auto 16px;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Queue / panel views ---------- */
  .panel-header{
    display:flex;align-items:center;gap:12px;
    margin:24px 0 18px;
  }
  .panel-header h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0;
  }
  .panel-header .rule{flex:1;height:1px;background:var(--rule);}

  .queue-group{
    border:1px solid var(--rule-strong);
    border-radius:6px;
    background:var(--panel);
    padding:16px 18px;
    margin-bottom:14px;
  }
  .queue-group-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .queue-target{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16px;
    color:var(--gold);
  }
  .queue-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--slate-light);
  }
  .queue-ready-toggle{margin-left:auto;}
  .queue-tree{list-style:none;margin:0;padding:0;}
  .queue-tree li{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--slate);
    padding:5px 0 5px 18px;
    border-left:1px solid var(--rule-strong);
    margin-left:4px;
    position:relative;
  }
  .queue-tree li::before{
    content:"├─";
    position:absolute;
    left:-2px;
    color:var(--rule-strong);
  }

  .fb-list{list-style:none;margin:0;padding:0;}
  .fb-list li{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 14px;
    border:1px solid var(--rule-strong);
    border-radius:5px;
    background:var(--panel);
    margin-bottom:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }
  .fb-list li .grp-tag{color:var(--slate-light);font-size:11px;}

  /* ---------- Export modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.6);
    display:flex;align-items:center;justify-content:center;
    z-index:100;
    padding:24px;
  }
  .modal{
    background:var(--panel-raised);
    border:1px solid var(--rule-strong);
    border-radius:8px;
    max-width:640px;
    width:100%;
    max-height:80vh;
    display:flex;flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;
    border-bottom:1px solid var(--rule);
  }
  .modal-head h3{margin:0;font-family:'Fraunces',serif;font-size:17px;font-weight:600;}
  .modal-close{
    background:transparent;border:none;color:var(--slate-light);
    font-size:18px;cursor:pointer;line-height:1;padding:4px;
  }
  .modal-close:hover{color:var(--ink);}
  .modal-body{padding:16px 20px;overflow:auto;}
  .modal-body textarea{
    width:100%;min-height:320px;
    background:var(--bg);
    border:1px solid var(--rule-strong);
    border-radius:5px;
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    line-height:1.6;
    padding:12px;
    resize:vertical;
  }
  .modal-foot{
    display:flex;justify-content:flex-end;gap:10px;
    padding:14px 20px;
    border-top:1px solid var(--rule);
  }

  .save-note{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--slate-light);
  }

  footer{
    border-top:1px solid var(--rule-strong);
    padding:24px 0 50px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--slate-light);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }

  @media (max-width:640px){
    .wrap{padding:0 18px;}
    .id-row{gap:16px;}
    .avatar{width:64px;height:64px;}
    .dash-grid{grid-template-columns:repeat(3,1fr);}
    .dash-cell:nth-child(9n){border-right:1px solid var(--rule);}
    .dash-cell:nth-child(3n){border-right:none;}
    .field-row{grid-template-columns:1fr;}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a href="../index.html" class="nav-link">Portfolio</a>
    <a href="index.html" class="nav-link active">Cleanup</a>
    <a href="../PROGRESS-MAP/index.html" class="nav-link">Progress Map</a>
  </div>
</nav>

<div class="wrap">
  <header class="masthead">
    <div class="eyebrow"><span>Repository Cleanup Command Center</span><span class="date" id="reportDate"></span></div>
    <div class="id-row">
      <img class="avatar" id="avatar" src="" alt="" style="display:none;">
      <div class="id-main">
        <h1 id="displayName">Loading…</h1>
        <div class="handle" id="handleLine"></div>
        <p class="bio" id="bioLine"></p>
      </div>
    </div>
  </header>

  <div class="dash-heading"><h2>Cleanup Dashboard</h2><div class="rule"></div><span class="save-note" id="saveNote"></span></div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="dash-grid" id="dashGrid">
    <div class="dash-cell"><span class="num" id="dTotal">—</span><span class="lbl">Total</span></div>
    <div class="dash-cell"><span class="num" id="dReviewed">—</span><span class="lbl">Reviewed</span></div>
    <div class="dash-cell accent-keep"><span class="num" id="dKeep">—</span><span class="lbl">Keep</span></div>
    <div class="dash-cell accent-merge"><span class="num" id="dMerge">—</span><span class="lbl">Merge</span></div>
    <div class="dash-cell accent-archive"><span class="num" id="dArchive">—</span><span class="lbl">Archive</span></div>
    <div class="dash-cell accent-dup"><span class="num" id="dDup">—</span><span class="lbl">Duplicate</span></div>
    <div class="dash-cell"><span class="num" id="dFirebase">—</span><span class="lbl">Firebase</span></div>
    <div class="dash-cell"><span class="num" id="dNoFirebase">—</span><span class="lbl">No Firebase</span></div>
    <div class="dash-cell"><span class="num" id="dUnassigned">—</span><span class="lbl">Unassigned</span></div>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search repositories…">
    </div>
    <select id="actionFilter">
      <option value="">All actions</option>
      <option value="KEEP">Keep</option>
      <option value="MERGE">Merge</option>
      <option value="ARCHIVE">Archive</option>
      <option value="DUPLICATE">Duplicate</option>
      <option value="__unset">Unassigned</option>
    </select>
    <select id="groupFilter">
      <option value="">All groups</option>
    </select>
    <select id="backendFilter">
      <option value="">All backends</option>
      <option value="FIREBASE">Firebase</option>
      <option value="NO FIREBASE">No Firebase</option>
      <option value="__unset">Unassigned</option>
    </select>
    <select id="sortSelect">
      <option value="updated">Recently updated</option>
      <option value="stars">Most starred</option>
      <option value="name">Name A–Z</option>
      <option value="created">Newest</option>
    </select>
  </div>
  <div class="toolbar-row2">
    <button class="toggle-btn" id="unreviewedToggle">Show Unreviewed</button>
    <button class="btn" id="mergeQueueBtn">Merge Queue</button>
    <button class="btn" id="firebaseQueueBtn">Firebase Queue</button>
    <button class="btn primary" id="exportBtn">Export Plan</button>
    <button class="btn danger-outline" id="resetBtn">Reset Decisions</button>
  </div>

  <div class="lang-chips" id="langChips"></div>

  <div id="gridArea">
    <div class="loading"><div class="spinner"></div>Fetching repositories from GitHub…</div>
  </div>

  <footer>
    <span>Data sourced live from the GitHub API · decisions saved automatically</span>
    <span id="rateNote"></span>
  </footer>
</div>

<datalist id="repoNameList"></datalist>

<script>
const USERNAME = "fairefaretravels";
const GROUPS = ["H4H","STV","SENSTACK","BUSINESS","CONSUMER","EDUCATION","FOOD","CREATIVE","OTHER"];
const ACTIONS = ["KEEP","MERGE","ARCHIVE","DUPLICATE"];
const BACKENDS = ["FIREBASE","NO FIREBASE"];
const STORAGE_KEY = "cleanup-state";

const LANG_COLORS = {
  JavaScript:"#f1c40f", TypeScript:"#3178c6", Python:"#3572A5", Java:"#b07219",
  "C++":"#f34b7d", C:"#999999", "C#":"#178600", Go:"#00ADD8", Rust:"#dea584",
  Ruby:"#701516", PHP:"#8892BF", Swift:"#F05138", Kotlin:"#A97BFF", HTML:"#e34c26",
  CSS:"#8B5FBF", Shell:"#89e051", Vue:"#41b883", Dart:"#00B4AB", Scala:"#c22d40",
  Jupyter:"#DA5B0B", "Objective-C":"#7EA8FF"
};
function langColor(l){ return LANG_COLORS[l] || "#8A96A3"; }

let allRepos = [];
let repoById = {};
let decisions = {};   // repoId -> {action, group, backend, mergeTarget, notes}
let mergeReady = {};  // targetName -> bool
let suggestions = {}; // repoId -> {action, group, backend, target, confidence}
let activeLang = null;
let currentView = 'grid'; // 'grid' | 'mergeQueue' | 'firebaseQueue'
let displayName = '';
let saveTimer = null;

const el = id => document.getElementById(id);

function fmtNum(n){
  if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'k';
  return String(n);
}
function timeAgo(dateStr){
  const d = new Date(dateStr);
  const days = Math.floor((Date.now()-d)/86400000);
  if(days<1) return 'today';
  if(days<30) return days+'d ago';
  if(days<365) return Math.floor(days/30)+'mo ago';
  return Math.floor(days/365)+'y ago';
}

/* ---------------- persistence ---------------- */
async function loadState(){
  try{
    const result = await window.storage.get(STORAGE_KEY, false);
    if(result && result.value){
      const parsed = JSON.parse(result.value);
      decisions = parsed.decisions || {};
      mergeReady = parsed.mergeReady || {};
    }
  }catch(err){
    decisions = {};
    mergeReady = {};
  }
}
function scheduleSave(){
  el('saveNote').textContent = 'Saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 400);
}
async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify({decisions, mergeReady}), false);
    el('saveNote').textContent = 'Saved just now';
  }catch(err){
    el('saveNote').textContent = 'Save failed — retrying on next change';
  }
}
function getDecision(repoId){
  if(!decisions[repoId]) decisions[repoId] = {action:null, group:null, backend:null, mergeTarget:'', notes:''};
  return decisions[repoId];
}
function isReviewed(d){
  if(!d) return false;
  if(!d.action || !d.group || !d.backend) return false;
  if(d.action === 'MERGE' && !d.mergeTarget) return false;
  return true;
}

/* ---------------- suggestion engine ---------------- */
function normalizeName(name){
  return name.toLowerCase()
    .replace(/[-_]/g,'')
    .replace(/(pro|elite|app|org|copy|old|backup|beta|demo|v2|2)$/,'');
}
function guessGroup(text){
  const t = text.toLowerCase();
  const map = {H4H:['h4h','hit4hit'], STV:['stv','radiomeltdown','onair','broadcast'], SENSTACK:['senstack','sensor'],
    BUSINESS:['business','crm','invoice','client'], CONSUMER:['consumer'], EDUCATION:['edu','school','learn','course'],
    FOOD:['food','recipe','fare','travel','faire'], CREATIVE:['art','design','creative','studio']};
  for(const g of Object.keys(map)){
    if(map[g].some(k=>t.includes(k))) return g;
  }
  return 'OTHER';
}
function computeSuggestions(repos){
  const clusters = {};
  repos.forEach(r=>{
    const key = normalizeName(r.name);
    if(!clusters[key]) clusters[key] = [];
    clusters[key].push(r);
  });
  const out = {};
  repos.forEach(r=>{
    const key = normalizeName(r.name);
    const cluster = clusters[key];
    if(cluster.length > 1){
      const canonical = cluster.slice().sort((a,b)=>
        (b.stargazers_count - a.stargazers_count) || (new Date(a.created_at) - new Date(b.created_at))
      )[0];
      if(r.id === canonical.id){
        out[r.id] = {action:'KEEP', group:guessGroup(r.name+' '+(r.description||'')), backend:null, target:null, confidence:'MEDIUM'};
      } else {
        const sameLen = Math.abs(r.name.length - canonical.name.length) <= 3;
        out[r.id] = {action:'MERGE', group:guessGroup(canonical.name), backend:null, target:canonical.name, confidence: sameLen ? 'HIGH' : 'MEDIUM'};
      }
    } else {
      const hint = (r.name+' '+(r.description||'')).toLowerCase();
      const fb = hint.includes('firebase') ? 'FIREBASE' : 'NO FIREBASE';
      out[r.id] = {action:'KEEP', group:guessGroup(hint), backend:fb, target:null, confidence:'LOW'};
    }
  });
  return out;
}

/* ---------------- fetch + render shell ---------------- */
async function init(){
  el('reportDate').textContent = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});

  const groupSelect = el('groupFilter');
  GROUPS.forEach(g=>{
    const opt = document.createElement('option');
    opt.value = g; opt.textContent = g;
    groupSelect.appendChild(opt);
  });

  await loadState();

  try{
    const [userRes, reposRes] = await Promise.all([
      fetch(`https://api.github.com/users/${USERNAME}`),
      fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated`)
    ]);

    if(userRes.status === 404){
      throw new Error(`No GitHub user found for "${USERNAME}".`);
    }
    if(userRes.status === 403 || reposRes.status === 403){
      throw new Error('GitHub API rate limit reached for this network. Please try again in a few minutes.');
    }
    if(!userRes.ok || !reposRes.ok){
      throw new Error('GitHub API returned an unexpected error.');
    }

    const user = await userRes.json();
    const repos = await reposRes.json();

    renderProfile(user);
    allRepos = repos;
    repoById = {};
    allRepos.forEach(r=>{ repoById[r.id] = r; });
    suggestions = computeSuggestions(allRepos);

    renderRepoDatalist();
    renderLangChips(allRepos);
    renderDashboard();
    renderView();

    el('rateNote').textContent = 'Fetched just now';
  }catch(err){
    el('gridArea').innerHTML = `<div class="error">${err.message}</div>`;
    el('displayName').textContent = USERNAME;
  }
}

function renderProfile(user){
  displayName = user.name || user.login;
  el('displayName').textContent = displayName;
  el('handleLine').innerHTML = `<a href="${user.html_url}" target="_blank" rel="noopener">@${user.login} ↗</a>`;
  el('bioLine').textContent = user.bio || '';
  if(user.avatar_url){
    el('avatar').src = user.avatar_url;
    el('avatar').style.display = 'block';
  }
}

function renderRepoDatalist(){
  const list = el('repoNameList');
  list.innerHTML = '';
  allRepos.forEach(r=>{
    const opt = document.createElement('option');
    opt.value = r.name;
    list.appendChild(opt);
  });
}

function renderLangChips(repos){
  const counts = {};
  repos.forEach(r=>{ if(r.language) counts[r.language] = (counts[r.language]||0)+1; });
  const langs = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).slice(0,10);
  const wrap = el('langChips');
  wrap.innerHTML = '';
  if(langs.length === 0) return;

  const allChip = document.createElement('div');
  allChip.className = 'chip active';
  allChip.textContent = 'All languages';
  allChip.onclick = () => { activeLang = null; refreshChips(); renderView(); };
  wrap.appendChild(allChip);

  langs.forEach(l=>{
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.dataset.lang = l;
    chip.innerHTML = `<span class="dot" style="background:${langColor(l)}"></span>${l} <span style="color:var(--slate-light)">${counts[l]}</span>`;
    chip.onclick = () => { activeLang = l; refreshChips(); renderView(); };
    wrap.appendChild(chip);
  });
}
function refreshChips(){
  document.querySelectorAll('#langChips .chip').forEach(c=>{
    const isAll = !c.dataset.lang;
    c.classList.toggle('active', activeLang===null ? isAll : c.dataset.lang===activeLang);
  });
}

/* ---------------- dashboard ---------------- */
function renderDashboard(){
  const total = allRepos.length;
  let reviewed=0, keep=0, merge=0, archive=0, dup=0, fb=0, noFb=0, unassigned=0;
  allRepos.forEach(r=>{
    const d = decisions[r.id];
    if(isReviewed(d)) reviewed++;
    if(d){
      if(d.action==='KEEP') keep++;
      else if(d.action==='MERGE') merge++;
      else if(d.action==='ARCHIVE') archive++;
      else if(d.action==='DUPLICATE') dup++;
      if(d.backend==='FIREBASE') fb++;
      else if(d.backend==='NO FIREBASE') noFb++;
      if(!d.action && !d.group && !d.backend) unassigned++;
    } else {
      unassigned++;
    }
  });
  el('dTotal').textContent = total;
  el('dReviewed').textContent = reviewed;
  el('dKeep').textContent = keep;
  el('dMerge').textContent = merge;
  el('dArchive').textContent = archive;
  el('dDup').textContent = dup;
  el('dFirebase').textContent = fb;
  el('dNoFirebase').textContent = noFb;
  el('dUnassigned').textContent = unassigned;
  const pct = total ? Math.round((reviewed/total)*100) : 0;
  el('progressFill').style.width = pct + '%';
}

/* ---------------- filtering ---------------- */
function getFilters(){
  return {
    search: el('searchInput').value.trim().toLowerCase(),
    action: el('actionFilter').value,
    group: el('groupFilter').value,
    backend: el('backendFilter').value,
    sort: el('sortSelect').value,
    unreviewedOnly: el('unreviewedToggle').classList.contains('active')
  };
}
function matchesFilters(r, f){
  const d = decisions[r.id] || {};
  if(activeLang && r.language !== activeLang) return false;
  if(f.search && !(r.name.toLowerCase().includes(f.search) || (r.description||'').toLowerCase().includes(f.search))) return false;
  if(f.action){
    if(f.action==='__unset' ? !!d.action : d.action !== f.action) return false;
  }
  if(f.group){
    if(d.group !== f.group) return false;
  }
  if(f.backend){
    if(f.backend==='__unset' ? !!d.backend : d.backend !== f.backend) return false;
  }
  if(f.unreviewedOnly && isReviewed(d)) return false;
  return true;
}
function sortRepos(list, sortBy){
  const arr = list.slice();
  arr.sort((a,b)=>{
    if(sortBy==='stars') return b.stargazers_count - a.stargazers_count;
    if(sortBy==='name') return a.name.localeCompare(b.name);
    if(sortBy==='created') return new Date(b.created_at) - new Date(a.created_at);
    return new Date(b.pushed_at) - new Date(a.pushed_at);
  });
  return arr;
}

/* ---------------- card building ---------------- */
function buildFieldRow(r, d){
  const wrap = document.createElement('div');

  const row1 = document.createElement('div');
  row1.className = 'field-row';

  const actionField = document.createElement('div');
  actionField.className = 'field';
  actionField.innerHTML = `<label>Action</label>`;
  const actionSel = document.createElement('select');
  actionSel.appendChild(new Option('— unset —',''));
  ACTIONS.forEach(a=>actionSel.appendChild(new Option(a,a)));
  actionSel.value = d.action || '';
  actionField.appendChild(actionSel);

  const groupField = document.createElement('div');
  groupField.className = 'field';
  groupField.innerHTML = `<label>Group</label>`;
  const groupSel = document.createElement('select');
  groupSel.appendChild(new Option('— unset —',''));
  GROUPS.forEach(g=>groupSel.appendChild(new Option(g,g)));
  groupSel.value = d.group || '';
  groupField.appendChild(groupSel);

  row1.appendChild(actionField);
  row1.appendChild(groupField);

  const row2 = document.createElement('div');
  row2.className = 'field-row';

  const backendField = document.createElement('div');
  backendField.className = 'field';
  backendField.innerHTML = `<label>Backend</label>`;
  const backendSel = document.createElement('select');
  backendSel.appendChild(new Option('— unset —',''));
  BACKENDS.forEach(b=>backendSel.appendChild(new Option(b,b)));
  backendSel.value = d.backend || '';
  backendField.appendChild(backendSel);

  const targetField = document.createElement('div');
  targetField.className = 'field';
  targetField.innerHTML = `<label>Merge target</label>`;
  const targetInput = document.createElement('input');
  targetInput.type = 'text';
  targetInput.setAttribute('list','repoNameList');
  targetInput.placeholder = 'target repo name';
  targetInput.value = d.mergeTarget || '';
  targetField.style.display = d.action === 'MERGE' ? 'block' : 'none';
  targetField.appendChild(targetInput);

  row2.appendChild(backendField);
  row2.appendChild(targetField);

  const notesField = document.createElement('div');
  notesField.className = 'field';
  notesField.innerHTML = `<label>Notes</label>`;
  const notesInput = document.createElement('input');
  notesInput.type = 'text';
  notesInput.placeholder = 'optional note';
  notesInput.value = d.notes || '';
  notesField.appendChild(notesInput);

  wrap.appendChild(row1);
  wrap.appendChild(row2);
  wrap.appendChild(notesField);

  function commit(){
    d.action = actionSel.value || null;
    d.group = groupSel.value || null;
    d.backend = backendSel.value || null;
    d.mergeTarget = targetInput.value.trim();
    d.notes = notesInput.value;
    targetField.style.display = d.action === 'MERGE' ? 'block' : 'none';
    scheduleSave();
    renderDashboard();
    if(currentView === 'grid') refreshCardChrome(r.id);
  }
  actionSel.addEventListener('change', commit);
  groupSel.addEventListener('change', commit);
  backendSel.addEventListener('change', commit);
  targetInput.addEventListener('change', commit);
  notesInput.addEventListener('change', commit);

  return {wrap, actionSel, groupSel, backendSel, targetInput, notesInput};
}

function refreshCardChrome(repoId){
  const card = document.querySelector(`.card[data-repo-id="${repoId}"]`);
  if(!card) return;
  const d = decisions[repoId] || {};
  card.className = 'card' + (d.action ? ` state-${d.action}` : '');
  const badge = card.querySelector('.reviewed-badge');
  if(badge){
    const rev = isReviewed(d);
    badge.textContent = rev ? '✓ Reviewed' : 'Unreviewed';
    badge.className = 'reviewed-badge ' + (rev ? 'yes' : 'no');
  }
}

function buildCard(r){
  const d = getDecision(r.id);
  const card = document.createElement('div');
  card.className = 'card' + (d.action ? ` state-${d.action}` : '');
  card.dataset.repoId = r.id;

  const top = document.createElement('div');
  top.className = 'card-top';
  const nameWrap = document.createElement('div');
  nameWrap.className = 'card-name-wrap';
  nameWrap.innerHTML = `
    <div class="card-name"><a href="${r.html_url}" target="_blank" rel="noopener">${r.name}</a></div>
    <div class="card-meta-line">
      ${r.fork ? '<span class="fork-badge">Forked</span>' : ''}
      ${r.language ? `<span class="lang-tag"><span class="lang-dot" style="background:${langColor(r.language)}"></span>${r.language}</span>` : ''}
      <span>★ ${fmtNum(r.stargazers_count)}</span>
      <span>Updated ${timeAgo(r.pushed_at)}</span>
    </div>
  `;
  const badge = document.createElement('span');
  const rev = isReviewed(d);
  badge.className = 'reviewed-badge ' + (rev ? 'yes' : 'no');
  badge.textContent = rev ? '✓ Reviewed' : 'Unreviewed';

  top.appendChild(nameWrap);
  top.appendChild(badge);
  card.appendChild(top);

  if(r.description){
    const desc = document.createElement('div');
    desc.className = 'card-desc';
    desc.textContent = r.description;
    card.appendChild(desc);
  }

  const sugg = suggestions[r.id];
  if(sugg && !d.action){
    const suggEl = document.createElement('div');
    suggEl.className = 'suggestion';
    const label = sugg.action === 'MERGE'
      ? `Suggested: MERGE → ${sugg.target} (${sugg.confidence})`
      : `Suggested: ${sugg.action}${sugg.group ? ' · '+sugg.group : ''}${sugg.backend ? ' · '+sugg.backend : ''} (${sugg.confidence})`;
    suggEl.innerHTML = `<span>${label}</span><button class="apply-sugg">Apply</button>`;
    suggEl.querySelector('.apply-sugg').addEventListener('click', ()=>{
      d.action = sugg.action;
      if(sugg.group) d.group = sugg.group;
      if(sugg.backend) d.backend = sugg.backend;
      if(sugg.target) d.mergeTarget = sugg.target;
      scheduleSave();
      renderDashboard();
      renderView();
    });
    card.appendChild(suggEl);
  }

  const fields = buildFieldRow(r, d);
  card.appendChild(fields.wrap);

  const actionsRow = document.createElement('div');
  actionsRow.className = 'card-actions-row';
  const mergeBtn = document.createElement('button');
  mergeBtn.className = 'btn';
  mergeBtn.textContent = 'Add to Merge Queue';
  mergeBtn.addEventListener('click', ()=>{
    fields.actionSel.value = 'MERGE';
    d.action = 'MERGE';
    scheduleSave();
    renderDashboard();
    renderView();
    setTimeout(()=>{
      const t = document.querySelector(`.card[data-repo-id="${r.id}"] input[list="repoNameList"]`);
      if(t) t.focus();
    }, 0);
  });
  actionsRow.appendChild(mergeBtn);
  card.appendChild(actionsRow);

  return card;
}

/* ---------------- grid view ---------------- */
function renderGridView(){
  const f = getFilters();
  const filtered = allRepos.filter(r => matchesFilters(r, f));
  const sorted = sortRepos(filtered, f.sort);

  const gridArea = el('gridArea');
  gridArea.innerHTML = '';

  if(sorted.length === 0){
    gridArea.innerHTML = '<div class="empty">No repositories match this filter.</div>';
    return;
  }

  if(f.group){
    const grid = document.createElement('div');
    grid.className = 'grid';
    sorted.forEach(r => grid.appendChild(buildCard(r)));
    gridArea.appendChild(grid);
    return;
  }

  const byGroup = {};
  const ungrouped = [];
  sorted.forEach(r=>{
    const g = (decisions[r.id]||{}).group;
    if(g){
      if(!byGroup[g]) byGroup[g] = [];
      byGroup[g].push(r);
    } else {
      ungrouped.push(r);
    }
  });

  GROUPS.forEach(g=>{
    if(!byGroup[g]) return;
    gridArea.appendChild(buildGroupBlock(g, byGroup[g]));
  });
  if(ungrouped.length){
    gridArea.appendChild(buildGroupBlock('UNASSIGNED', ungrouped));
  }
}
function buildGroupBlock(label, repos){
  const group = document.createElement('div');
  group.className = 'group';
  group.innerHTML = `
    <div class="group-header">
      <span class="tag"></span>
      <span class="group-title"><strong>${label}</strong></span>
      <span class="group-rule"></span>
      <span class="group-count">${repos.length}</span>
    </div>
  `;
  const grid = document.createElement('div');
  grid.className = 'grid';
  repos.forEach(r => grid.appendChild(buildCard(r)));
  group.appendChild(grid);
  return group;
}

/* ---------------- merge queue view ---------------- */
function renderMergeQueueView(){
  const gridArea = el('gridArea');
  gridArea.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'panel-header';
  header.innerHTML = `<h2>Merge Queue</h2><div class="rule"></div>`;
  const backBtn = document.createElement('button');
  backBtn.className = 'btn';
  backBtn.textContent = '← All repositories';
  backBtn.addEventListener('click', ()=>{ currentView='grid'; renderView(); });
  header.appendChild(backBtn);
  gridArea.appendChild(header);

  const byTarget = {};
  allRepos.forEach(r=>{
    const d = decisions[r.id];
    if(d && d.action === 'MERGE' && d.mergeTarget){
      if(!byTarget[d.mergeTarget]) byTarget[d.mergeTarget] = [];
      byTarget[d.mergeTarget].push(r);
    }
  });

  const targets = Object.keys(byTarget);
  if(targets.length === 0){
    gridArea.innerHTML += '<div class="empty">No repositories are queued for merge yet. Set a repo\'s action to MERGE and give it a target.</div>';
    return;
  }

  targets.sort().forEach(target=>{
    const wrap = document.createElement('div');
    wrap.className = 'queue-group';
    const head = document.createElement('div');
    head.className = 'queue-group-head';
    head.innerHTML = `<span class="queue-target">${target}</span><span class="queue-count">${byTarget[target].length} repo(s) merging in</span>`;
    const readyLabel = document.createElement('label');
    readyLabel.className = 'queue-ready-toggle';
    readyLabel.style.display = 'flex';
    readyLabel.style.alignItems = 'center';
    readyLabel.style.gap = '6px';
    readyLabel.style.fontFamily = "'IBM Plex Mono',monospace";
    readyLabel.style.fontSize = '11px';
    readyLabel.style.color = 'var(--slate-light)';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!mergeReady[target];
    cb.addEventListener('change', ()=>{
      mergeReady[target] = cb.checked;
      scheduleSave();
    });
    readyLabel.appendChild(cb);
    readyLabel.appendChild(document.createTextNode('Mark merge ready'));
    head.appendChild(readyLabel);
    wrap.appendChild(head);

    const tree = document.createElement('ul');
    tree.className = 'queue-tree';
    byTarget[target].forEach(r=>{
      const li = document.createElement('li');
      li.textContent = r.name;
      tree.appendChild(li);
    });
    wrap.appendChild(tree);
    gridArea.appendChild(wrap);
  });
}

/* ---------------- firebase queue view ---------------- */
function renderFirebaseQueueView(){
  const gridArea = el('gridArea');
  gridArea.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'panel-header';
  header.innerHTML = `<h2>Firebase Queue</h2><div class="rule"></div>`;
  const backBtn = document.createElement('button');
  backBtn.className = 'btn';
  backBtn.textContent = '← All repositories';
  backBtn.addEventListener('click', ()=>{ currentView='grid'; renderView(); });
  header.appendChild(backBtn);
  gridArea.appendChild(header);

  const fbRepos = allRepos.filter(r=>{
    const d = decisions[r.id];
    return d && d.backend === 'FIREBASE';
  });

  if(fbRepos.length === 0){
    gridArea.innerHTML += '<div class="empty">No repositories are marked as Firebase-backed yet.</div>';
    return;
  }

  const list = document.createElement('ul');
  list.className = 'fb-list';
  fbRepos.forEach(r=>{
    const d = decisions[r.id];
    const li = document.createElement('li');
    li.innerHTML = `<span>${r.name}</span><span class="grp-tag">${d.group || 'no group'} · ${d.action || 'no action'}</span>`;
    list.appendChild(li);
  });
  gridArea.appendChild(list);
}

function renderView(){
  if(currentView === 'mergeQueue') renderMergeQueueView();
  else if(currentView === 'firebaseQueue') renderFirebaseQueueView();
  else renderGridView();
}

/* ---------------- export ---------------- */
function buildExportPlan(){
  const byGroup = {};
  allRepos.forEach(r=>{
    const d = decisions[r.id];
    if(!d || !d.action) return;
    const g = d.group || 'UNASSIGNED';
    if(!byGroup[g]) byGroup[g] = {KEEP:[], MERGE:[], ARCHIVE:[], DUPLICATE:[], FIREBASE:[]};
    if(byGroup[g][d.action]) byGroup[g][d.action].push(r);
    if(d.backend === 'FIREBASE') byGroup[g].FIREBASE.push(r);
  });

  const lines = [];
  lines.push((displayName || USERNAME).toUpperCase());
  lines.push('REPOSITORY CLEANUP PLAN');
  lines.push(new Date().toLocaleDateString('en-US',{year:'numeric',month:'long'}));
  lines.push('');

  const groupOrder = [...GROUPS.filter(g=>byGroup[g]), ...(byGroup['UNASSIGNED'] ? ['UNASSIGNED'] : [])];

  groupOrder.forEach(g=>{
    const section = byGroup[g];
    lines.push(g);
    lines.push('────────────────────────');
    if(section.KEEP.length){
      lines.push('KEEP');
      section.KEEP.forEach(r=>lines.push(`• ${r.name}`));
    }
    if(section.MERGE.length){
      lines.push('MERGE');
      section.MERGE.forEach(r=>{
        const d = decisions[r.id];
        lines.push(`• ${r.name} → ${d.mergeTarget || '(no target set)'}`);
      });
    }
    if(section.ARCHIVE.length){
      lines.push('ARCHIVE');
      section.ARCHIVE.forEach(r=>lines.push(`• ${r.name}`));
    }
    if(section.DUPLICATE.length){
      lines.push('DUPLICATE');
      section.DUPLICATE.forEach(r=>{
        const d = decisions[r.id];
        lines.push(`• ${r.name}${d.mergeTarget ? ' → '+d.mergeTarget : ''}`);
      });
    }
    if(section.FIREBASE.length){
      lines.push('FIREBASE');
      section.FIREBASE.forEach(r=>lines.push(`• ${r.name}`));
    }
    lines.push('');
  });

  const reviewedCount = allRepos.filter(r=>isReviewed(decisions[r.id])).length;
  lines.push('────────────────────────');
  lines.push(`${reviewedCount} / ${allRepos.length} repositories reviewed`);

  return lines.join('\n');
}

function openExportModal(){
  const text = buildExportPlan();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <h3>Cleanup Plan Export</h3>
        <button class="modal-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <textarea readonly></textarea>
      </div>
      <div class="modal-foot">
        <button class="btn" id="copyPlanBtn">Copy to clipboard</button>
        <button class="btn primary" id="downloadPlanBtn">Download .txt</button>
      </div>
    </div>
  `;
  overlay.querySelector('textarea').value = text;
  document.body.appendChild(overlay);

  function close(){ document.body.removeChild(overlay); }
  overlay.querySelector('.modal-close').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });

  overlay.querySelector('#copyPlanBtn').addEventListener('click', async ()=>{
    try{
      await navigator.clipboard.writeText(text);
      overlay.querySelector('#copyPlanBtn').textContent = 'Copied ✓';
    }catch(err){
      overlay.querySelector('textarea').select();
    }
  });
  overlay.querySelector('#downloadPlanBtn').addEventListener('click', ()=>{
    const blob = new Blob([text], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${USERNAME}-repository-cleanup-plan.txt`;
    a.click();
    URL.revokeObjectURL(url);
  });
}

/* ---------------- toolbar wiring ---------------- */
el('searchInput').addEventListener('input', renderView);
el('actionFilter').addEventListener('change', renderView);
el('groupFilter').addEventListener('change', renderView);
el('backendFilter').addEventListener('change', renderView);
el('sortSelect').addEventListener('change', renderView);
el('unreviewedToggle').addEventListener('click', ()=>{
  el('unreviewedToggle').classList.toggle('active');
  renderView();
});
el('mergeQueueBtn').addEventListener('click', ()=>{
  currentView = currentView === 'mergeQueue' ? 'grid' : 'mergeQueue';
  renderView();
});
el('firebaseQueueBtn').addEventListener('click', ()=>{
  currentView = currentView === 'firebaseQueue' ? 'grid' : 'firebaseQueue';
  renderView();
});
el('exportBtn').addEventListener('click', openExportModal);
el('resetBtn').addEventListener('click', async ()=>{
  if(!confirm('Reset all cleanup decisions? This clears every action, group, backend, target, and note for this portfolio.')) return;
  decisions = {};
  mergeReady = {};
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify({decisions, mergeReady}), false);
  }catch(err){}
  renderDashboard();
  currentView = 'grid';
  renderView();
});

init();
</script>
